<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Đăng nhập / Đăng ký</title>
	<link rel="stylesheet" href="../css/style.css">
</head>

<body>
	<header class="site-header">
		<div class="header-inner">
			<a href="../index.html" class="brand">My Shop</a>
			<div class="header-search">
				<input type="text" placeholder="Tìm kiếm sản phẩm...">
				<button class="search-button" type="button" aria-label="Tìm kiếm">🔍</button>
			</div>
			<div class="header-actions">
				<a href="login.html" class="header-btn header-login-link">Login</a>
				<a href="cart.html" class="header-btn">Giỏ hàng<span class="header-cart-count"></span></a>
			</div>
		</div>
	</header>

	<nav class="category-nav">
		<div class="category-nav-inner">
			<a href="#" data-category="dien-thoai">Điện thoại</a>
			<a href="#" data-category="laptop">Laptop</a>
			<a href="#" data-category="phu-kien">Phụ kiện</a>
			<a href="#" data-category="smartwatch">Smartwatch</a>
			<a href="#" data-category="dong-ho">Đồng hồ</a>
			<a href="#" data-category="tablet">Tablet</a>
			<a href="#" data-category="may-cu">Máy cũ, Thu cũ</a>
			<a href="#" data-category="man-hinh">Màn hình, Máy in</a>
			<a href="#" data-category="sim">Sim, Thẻ cào</a>
			<a href="#" data-category="dich-vu">Dịch vụ liên ích</a>
		</div>
	</nav>

	<main class="container">
		<div class="box form-box mt-20">
			<h2 id="loginTitle">Đăng nhập</h2>
			<p id="loginSubtitle">Chào mừng bạn quay lại My Shop</p>

			<form novalidate>
				<div class="login-field-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="example@email.com" required>
				</div>

				<div class="login-field-group">
					<label for="password">Mật khẩu</label>
					<input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
				</div>

				<div id="loginRememberRow">
					<label id="loginRememberLabel">
						<input type="checkbox" id="loginRememberInput">
						<span>Nhớ tôi</span>
					</label>
					<a href="forgot-password.html" id="loginForgotLink">Quên mật khẩu?</a>
				</div>

				<button class="w-100" id="loginBtn" type="submit">Đăng nhập</button>
			</form>

			<div id="loginDivider">
				<div id="loginDividerLeft"></div>
				<span id="loginDividerText">HOẶC</span>
				<div id="loginDividerRight"></div>
			</div>

			<button class="social-login-btn" id="facebookLoginBtn">🔵 Đăng nhập bằng Facebook</button>
			<button class="social-login-btn" id="googleLoginBtn">🔎 Đăng nhập bằng Google</button>

			<p id="registerText">
				Bạn chưa có tài khoản?
				<a href="sign.html" id="registerLink">Đăng ký ngay</a>
			</p>
		</div>
	</main>

	<footer>
		<p>© 2026 My Shop</p>
	</footer>

	<script src="../js/common.js"></script>
	<script src="../js/auth.js"></script>
</body>

</html>
