<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">My Shop</a>
      <div class="header-search">
        <input type="text" placeholder="Tìm kiếm sản phẩm...">
        <button class="search-button" type="button" aria-label="Tìm kiếm">🔍</button>
      </div>
      <div class="header-actions">
        <a href="login.html" class="header-btn">Login</a>
        <a href="cart.html" class="header-btn">Giỏ hàng</a>
        <button type="button" class="header-location-btn">Tìm vị trí</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="box form-box forgot-password-box">
      <div class="forgot-password-header">
        <a href="login.html" class="forgot-back">← Quay lại</a>
      </div>

      <h2 id="loginTitle">Quên mật khẩu</h2>
      <p id="forgotText" class="forgot-password-text">Nhập email của bạn để nhận mã xác minh.</p>

      <form>
        <div class="login-field-group">
          <label id="forgotLabel" for="forgotInput">Email</label>
          <input type="email" id="forgotInput" name="email" placeholder="example@email.com" required>
        </div>

        <button class="forgot-verify-btn" id="loginBtn" type="submit">Gửi mã xác minh</button>
      </form>

      <button id="toggleContactType" class="forgot-alt-btn" type="button">Hoặc số điện thoại</button>


    </div>
  </main>

  <footer><p>© 2026 My Shop</p></footer>

  <script src="../js/script.js" defer></script>
</body>
</html>
